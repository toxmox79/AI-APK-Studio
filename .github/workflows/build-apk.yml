name: Fix Kotlin & Build AI APK Studio

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  fix-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fix MainViewModel Kotlin errors
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/de/aiapk/studio/MainViewModel.kt")
          text = path.read_text(encoding="utf-8")

          old_loop = "        repeat(passes) { index ->"
          new_loop = "        for (index in 0 until passes) {"
          if old_loop in text:
              text = text.replace(old_loop, new_loop, 1)

          old_source = '            val source = likely.joinToString("\\n\\n") { path -> "--- $path ---\\n${projectStore.readFile(project.path, path).take(20_000)}" }.take(60_000)'
          new_source = '''            val sourceParts = mutableListOf<String>()
            for (path in likely) {
                sourceParts += "--- $path ---\\n${projectStore.readFile(project.path, path).take(20_000)}"
            }
            val source = sourceParts.joinToString("\\n\\n").take(60_000)'''
          if old_source in text:
              text = text.replace(old_source, new_source, 1)

          path.write_text(text, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/de/aiapk/studio/MainViewModel.kt
          if ! git diff --cached --quiet; then
            git commit -m "Fix coroutine repair loop compilation"
            git push
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-APK-Studio-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
